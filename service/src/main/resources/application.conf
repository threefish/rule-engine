# Akka 系统核心配置
akka {
  loglevel = INFO
  actor {
    provider = "akka.actor.LocalActorRefProvider"

    # 1. 默认调度器（CPU 密集型任务）
    default-dispatcher {
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 4        # 最小线程数
        parallelism-factor = 1.5   # 线程数 = CPU核心数 × 1.5
        parallelism-max = 16       # 最大线程数（避免过多上下文切换）
      }
      throughput = 10             # 单个 Actor 一次处理 10 条消息再切换
    }

    # 2. 自定义调度器（IO 密集型任务：如发邮件、数据库查询）
    flow-blocking-dispatcher {
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 22       # 固定 20 个线程（IO 任务阻塞时不占用 CPU）
        keep-alive-time = 60s      # 空闲线程存活时间
      }
      throughput = 1              # IO 任务一次处理 1 条消息（避免阻塞其他任务）
      fallback = "akka.actor.default-dispatcher" # 降级策略
    }
  }
}
